# Log rotation for the Hetzner scanner host (2026-09-08 review, fix 7).
# Runs as the service user from cron via scripts/rotate_logs.sh — no root:
#   7 4 * * * cd /home/mrhea/HealysBacktester && ./scripts/rotate_logs.sh >> logs/logrotate.log 2>&1
# copytruncate: the cron jobs append with >> and the feed daemons hold their
# log open for days, so the file is copied then truncated in place instead
# of renamed (a rename would leave long-lived writers on the old inode).
/home/mrhea/HealysBacktester/logs/*.log {
    daily
    maxsize 100M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}
