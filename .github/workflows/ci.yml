name: tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        # The suite is self-contained (synthetic fixtures / tmp dirs) and must
        # not require LightGBM, network access, or v31 artifacts.
        # `python -m` (the repo-wide convention) is load-bearing: it puts the
        # repo root on sys.path. Bare `pytest` walks past the vestigial root
        # __init__.py and prepends the repo's PARENT dir instead, so every
        # `import nn_meta` fails at collection on the runners.
        run: python -m pytest tests/ -q
