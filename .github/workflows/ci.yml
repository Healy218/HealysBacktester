name: tests

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs cancel: rapid consecutive pushes cost one run, not N.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped 2026-08-16: it bills 10x on private repos and the
        # entire toolchain is Linux now (home box, server, GCP images) — a
        # weekend of pushes burned 2 months of Actions quota, mostly here.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        # The suite is self-contained (synthetic fixtures / tmp dirs) and must
        # not require LightGBM, network access, or v31 artifacts.
        # `python -m` (the repo-wide convention) is load-bearing: it puts the
        # repo root on sys.path. Bare `pytest` walks past the vestigial root
        # __init__.py and prepends the repo's PARENT dir instead, so every
        # `import nn_meta` fails at collection on the runners.
        run: python -m pytest tests/ -q
